site_name: CS Study
site_url: https://hundredman.github.io/cs-study
site_description: TOPCIT 시험 준비 및 CS 공부 정리
site_author: hundredman

repo_name: hundredman/cs-study
repo_url: https://github.com/hundredman/cs-study

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ko

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - 홈: index.md
  - TOPCIT:
    - 개요: TOPCIT/README.md
    - 1. 소프트웨어 개발:
      - 개요: TOPCIT/01_소프트웨어개발/README.md
      - 알고리즘: TOPCIT/01_소프트웨어개발/01_알고리즘.md
      - 자료구조: TOPCIT/01_소프트웨어개발/02_자료구조.md
      - 소프트웨어 공학: TOPCIT/01_소프트웨어개발/03_소프트웨어공학.md
      - 객체지향 프로그래밍: TOPCIT/01_소프트웨어개발/04_객체지향프로그래밍.md
      - 연습문제: TOPCIT/01_소프트웨어개발/05_연습문제.md
    - 2. 데이터베이스:
